<title>Amaidhi Prototypes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#EDF1F0">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F1719">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arima:wght@500;700&family=Catamaran:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Noto+Serif+Tamil:wght@400;600&display=swap">
<style>
/* Layout: calm reading surfaces; heat colour appears only where anger is measured (the 1–10 meter). */
:root {
  --bg: #EDF1F0;
  --surface: #F9FBFA;
  --ink: #15232A;
  --muted: #5A696E;
  --line: rgba(21, 35, 42, 0.12);
  --chip: #E2E9E7;
  --accent: #2D6B64;
  --accent-ink: #F4FAF8;
  --cool: #5A9E91;
  --hot: #D24E2C;
  --f-ui: "Catamaran", "Noto Sans Tamil", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-serif: "Newsreader", "Noto Serif Tamil", Georgia, serif;
  --f-display: "Arima", "Catamaran", system-ui, sans-serif;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-io: cubic-bezier(0.77, 0, 0.175, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1719; --surface: #162125; --ink: #E3ECEA; --muted: #93A4A6;
    --line: rgba(227, 236, 234, 0.12); --chip: #1F2D31;
    --accent: #7CC3B6; --accent-ink: #0C1A1A; --cool: #6BB5A8; --hot: #F07A52;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1719; --surface: #162125; --ink: #E3ECEA; --muted: #93A4A6;
  --line: rgba(227, 236, 234, 0.12); --chip: #1F2D31;
  --accent: #7CC3B6; --accent-ink: #0C1A1A; --cool: #6BB5A8; --hot: #F07A52;
  color-scheme: dark;
}

html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-ui);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body[data-variant="night"] { background: #0B1220; }
.j > *, .g > *, .n > *, .j-grid > *, .n-hero > * { min-width: 0; }
:lang(ta) body, :lang(ta) .t { line-height: 1.65; }
* { box-sizing: border-box; }
button, a, [role="button"] { touch-action: manipulation; }
button { font: inherit; color: inherit; cursor: pointer; user-select: none; -webkit-user-select: none; }
textarea { font: inherit; font-size: 16px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#stage {
  padding-top: 76px;
  padding-bottom: 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- shared controls ---------- */
.press { transition: transform 140ms var(--ease-out), background-color 160ms ease, color 160ms ease; }
.press:active { transform: scale(0.97); }

.lang { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--chip); }
.lang button { border: 0; background: transparent; padding: 4px 12px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }

.qexit {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px;
  font-size: 14px; font-weight: 600; color: var(--muted); text-decoration: none; border: 1px solid var(--line);
  white-space: nowrap;
}

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; border-radius: 12px; padding: 10px 18px; font-weight: 600; font-size: 16px;
  background: var(--accent); color: var(--accent-ink);
}
.btn.ghost { background: var(--chip); color: var(--ink); }

.meter { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
.meter button {
  --h: var(--cool);
  border: 0; border-radius: 8px; height: 40px; font-weight: 700; font-size: 15px;
  font-variant-numeric: tabular-nums;
  background: color-mix(in oklch, var(--h) 20%, var(--surface)); color: var(--ink);
}
.meter button[aria-pressed="true"] { background: var(--h); color: #fff; }
.meter-label { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button {
  border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 12px; font-size: 14px;
}
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.note {
  width: 100%; min-height: 64px; resize: vertical; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); padding: 10px 12px;
}

.logs { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.logs li { display: grid; grid-template-columns: 4.5em 2.4em 1fr; gap: 10px; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }
.logs li:first-child { border-top: 0; }
.logs .day { color: var(--muted); font-size: 14px; }
.lvl {
  --h: var(--cool);
  display: inline-grid; place-items: center; width: 2.2em; height: 1.6em; border-radius: 6px;
  background: var(--h); color: #fff; font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums;
}
.logs .what { min-width: 0; }
.logs .what small { display: block; color: var(--muted); font-size: 14px; }
.tag { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.example { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); }

.foot { display: grid; gap: 6px; font-size: 14px; color: var(--muted); }
.foot strong { color: var(--ink); font-weight: 600; }
.foot .lines { user-select: text; font-variant-numeric: tabular-nums; }

@media (hover: hover) and (pointer: fine) {
  .chips button:hover { border-color: var(--muted); }
  .qexit:hover { color: var(--ink); border-color: var(--muted); }
  .btn.ghost:hover { background: color-mix(in oklch, var(--chip) 80%, var(--ink)); }
  .lang button:hover { color: var(--ink); }
}

/* entrance: plays only on mount, never on re-render */
[data-enter] .enter { animation: rise 320ms var(--ease-out) both; }
[data-enter] .enter:nth-child(2) { animation-delay: 50ms; }
[data-enter] .enter:nth-child(3) { animation-delay: 100ms; }
[data-enter] .enter:nth-child(4) { animation-delay: 150ms; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }

/* ---------- 1 · JOURNAL ---------- */
.j { max-width: 1080px; margin: 0 auto; display: grid; gap: 40px; }
.j-head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.j-brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; flex-wrap: wrap; }
@media (max-width: 560px) { .j-brand { flex-basis: 100%; } }
.j-cool { white-space: nowrap; }
.j-brand b { font-family: var(--f-serif); font-weight: 500; font-size: 24px; letter-spacing: -0.01em; }
.j-brand span { color: var(--muted); font-size: 14px; }
.j-cool { border: 0; border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 14px; background: var(--accent); color: var(--accent-ink); }
.j-hero { display: grid; gap: 14px; max-width: 62ch; }
.j-hero h1 { font-family: var(--f-serif); font-weight: 400; font-size: clamp(34px, 6vw, 56px); line-height: 1.08; letter-spacing: -0.02em; }
:lang(ta) .j-hero h1 { font-size: clamp(28px, 5vw, 44px); line-height: 1.3; letter-spacing: 0; }
.j-hero p { font-size: 18px; color: var(--muted); }
.j-ticks { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; max-width: 360px; }
.j-ticks i { height: 4px; border-radius: 2px; background: var(--line); }
.j-ticks i.on { background: var(--accent); }
.j-ticks i.now { background: color-mix(in oklch, var(--accent) 45%, var(--bg)); }
.j-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 48px; align-items: start; }
@media (max-width: 820px) { .j-grid { grid-template-columns: minmax(0, 1fr); gap: 32px; } }
.j-toc h2, .j-side h2 { font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.j-toc ol { list-style: none; margin: 0; padding: 0; }
.j-row { border-top: 1px solid var(--line); }
.j-row > button {
  width: 100%; display: grid; grid-template-columns: 3.2em minmax(0, 1fr) auto; gap: 12px; align-items: baseline;
  padding: 14px 0; border: 0; background: transparent; text-align: left;
}
.j-row .n { font-family: var(--f-serif); font-size: 20px; color: var(--muted); font-variant-numeric: tabular-nums; }
.j-row .ti { font-family: var(--f-serif); font-size: 20px; line-height: 1.3; }
:lang(ta) .j-row .ti { font-size: 17px; }
.j-row .st { font-size: 13px; color: var(--muted); white-space: nowrap; }
.j-row .st.cur { color: var(--accent); font-weight: 600; }
.j-row .st.done::before { content: "✓ "; }
.j-row[data-current] .n, .j-row[data-current] .ti { color: var(--accent); }
.j-detail { padding: 0 0 16px 3.2em; padding-left: calc(3.2em + 12px); display: grid; gap: 8px; color: var(--muted); max-width: 60ch; }
.j-detail b { color: var(--ink); font-weight: 600; }
.j-side { display: grid; gap: 28px; }
.j-card { background: var(--surface); border-radius: 16px; padding: 20px; display: grid; gap: 14px; box-shadow: 0 1px 0 var(--line), 0 8px 24px rgba(21,35,42,0.05); }
.j-card .pr { font-family: var(--f-serif); font-size: 21px; line-height: 1.3; }
:lang(ta) .j-card .pr { font-size: 18px; }
.j-card .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.j-card .meta { font-size: 14px; color: var(--muted); }
.j-sub { font-size: 15px; font-weight: 600; }
@media (hover: hover) and (pointer: fine) {
  .j-row > button:hover .ti { color: var(--accent); }
}

/* ---------- 2 · GUIDED ---------- */
.g { max-width: 460px; margin: 0 auto; display: grid; gap: 20px; padding-bottom: 96px; }
.g-head { display: flex; align-items: center; gap: 10px; }
.g-head b { font-family: var(--f-display); font-size: 22px; margin-right: auto; }
.g-track { display: grid; gap: 8px; }
.g-track .bars { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; }
.g-track .bars i { height: 8px; border-radius: 4px; background: var(--chip); }
.g-track .bars i.on { background: var(--accent); }
.g-track .bars i.now { background: linear-gradient(90deg, var(--accent) 40%, var(--chip) 40%); }
.g-track .lbl { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); }
.g-step {
  border-radius: 24px; padding: 24px; display: grid; gap: 14px;
  background: var(--accent); color: var(--accent-ink);
}
.g-step .tag { color: inherit; opacity: 0.75; }
.g-step h2 { font-family: var(--f-display); font-weight: 700; font-size: 28px; line-height: 1.15; }
:lang(ta) .g-step h2 { font-size: 23px; line-height: 1.35; }
.g-step p { opacity: 0.85; }
.g-step .btn { background: var(--accent-ink); color: var(--accent); justify-self: start; }
.g-card { background: var(--surface); border-radius: 20px; padding: 20px; display: grid; gap: 14px; box-shadow: 0 1px 0 var(--line); }
.g-card h3 { font-size: 17px; font-weight: 700; }
.g-mods { display: grid; gap: 8px; }
.g-mod { background: var(--surface); border-radius: 16px; box-shadow: 0 1px 0 var(--line); }
.g-mod > button { width: 100%; border: 0; background: transparent; text-align: left; padding: 16px; display: grid; grid-template-columns: 40px minmax(0,1fr) auto; gap: 12px; align-items: center; }
.g-mod .num { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--chip); font-weight: 700; font-variant-numeric: tabular-nums; }
.g-mod[data-state="done"] .num { background: var(--accent); color: var(--accent-ink); }
.g-mod[data-state="current"] .num { box-shadow: inset 0 0 0 2px var(--accent); color: var(--accent); background: transparent; }
.g-mod .ti { font-weight: 600; line-height: 1.3; }
.g-mod .sub { font-size: 13px; color: var(--muted); }
.g-mod .pill { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.g-mod[data-state="current"] .pill { background: color-mix(in oklch, var(--accent) 18%, var(--surface)); color: var(--accent); }
.g-mod .more { padding: 0 16px 16px 68px; display: grid; gap: 10px; color: var(--muted); font-size: 15px; }
.g-mod .more b { color: var(--ink); }
.g-tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in oklch, var(--surface) 88%, transparent);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  border-top: 1px solid var(--line);
}
.g-tabs .in { max-width: 460px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr 1.2fr 1fr; align-items: center; height: 68px; }
.g-tabs button { border: 0; background: transparent; display: grid; justify-items: center; gap: 2px; font-size: 12px; font-weight: 600; color: var(--muted); padding: 6px 0; }
.g-tabs button svg { width: 22px; height: 22px; }
.g-tabs button[aria-current="page"] { color: var(--accent); }
.g-tabs .coolbtn { justify-self: center; width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); transform: translateY(-14px); box-shadow: 0 8px 20px color-mix(in oklch, var(--accent) 35%, transparent); place-items: center; padding: 0; }
.g-tabs .coolbtn:active { transform: translateY(-14px) scale(0.95); }

/* ---------- 3 · NIGHT (deliberately single-look, dark) ---------- */
.n {
  --n-bg: #0B1220; --n-ink: #E7EEF5; --n-muted: #8C9AB0; --n-line: rgba(231,238,245,0.1); --n-glow: #5FB6A9; --n-chip: rgba(231,238,245,0.07);
  --surface: #121B2C; --bg: #0B1220; --ink: #E7EEF5; --muted: #8C9AB0; --line: rgba(231,238,245,0.1); --chip: rgba(231,238,245,0.07);
  --accent: #7FD0C2; --accent-ink: #07131A; --cool: #5FB6A9; --hot: #FF7A4D;
  color: var(--n-ink); color-scheme: dark;
  max-width: 720px; margin: 0 auto; display: grid; gap: 36px;
}
.n-head { display: flex; align-items: center; gap: 10px; }
.n-head b { font-family: var(--f-display); font-size: 20px; margin-right: auto; letter-spacing: 0.01em; }
.n-hero { display: grid; justify-items: center; text-align: center; gap: 22px; padding-top: 8px; }
.n-orb {
  width: 120px; height: 120px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #A9E6DB, #3E8F86 55%, #1C4A52 100%);
  box-shadow: 0 0 60px rgba(95,182,169,0.35), 0 0 140px rgba(95,182,169,0.15);
  animation: drift 10s var(--ease-io) infinite;
}
@keyframes drift { 0%, 100% { transform: scale(0.88); } 40% { transform: scale(1); } }
.n-hero h1 { font-family: var(--f-display); font-weight: 500; font-size: clamp(28px, 5vw, 40px); line-height: 1.15; }
:lang(ta) .n-hero h1 { font-size: clamp(22px, 4vw, 30px); line-height: 1.4; }
.n-therm { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; align-items: end; width: 100%; max-width: 520px; }
.n-therm button { --h: var(--cool); border: 0; border-radius: 8px; display: grid; align-content: end; justify-items: center; padding: 0 0 6px; background: var(--n-chip); color: var(--n-muted); font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; transition: background-color 180ms ease, color 180ms ease, transform 140ms var(--ease-out); }
.n-therm button.fill { background: var(--h); color: #0B1220; }
.n-therm button:active { transform: scale(0.95); }
.n-scale { display: flex; justify-content: space-between; width: 100%; max-width: 520px; font-size: 13px; color: var(--n-muted); }
.n-reply { width: 100%; max-width: 520px; display: grid; gap: 14px; justify-items: center; padding: 20px; border-radius: 20px; background: var(--n-chip); }
.n-reply p { font-size: 18px; }
.n-reply .chips { justify-content: center; }
.n-reply .btn { border-radius: 999px; padding: 12px 22px; }
.n-reply .hotbtn { background: var(--hot); color: #fff; }
.n-path h2 { font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--n-muted); font-weight: 600; margin-bottom: 10px; }
.n-weeks { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; overscroll-behavior-x: contain; }
.n-weeks button { scroll-snap-align: start; flex: 0 0 auto; border: 1px solid var(--n-line); background: transparent; border-radius: 14px; padding: 10px 14px; display: grid; gap: 2px; text-align: left; min-width: 76px; }
.n-weeks button .k { font-size: 12px; color: var(--n-muted); }
.n-weeks button .v { font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.n-weeks button[data-state="done"] .v::after { content: " ✓"; color: var(--accent); font-size: 14px; }
.n-weeks button[data-state="current"] { border-color: var(--accent); background: rgba(127,208,194,0.08); }
.n-weeks button[aria-pressed="true"] { background: rgba(231,238,245,0.1); }
.n-mod { margin-top: 14px; padding: 18px; border-radius: 16px; background: var(--n-chip); display: grid; gap: 8px; }
.n-mod h3 { font-family: var(--f-display); font-weight: 500; font-size: 22px; }
.n-mod p { color: var(--n-muted); }
.n-mod b { color: var(--n-ink); font-weight: 600; }
.n .foot strong { color: var(--n-ink); }

/* ---------- cool-down sheet (one dark look in every theme) ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 2147483000; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(5, 10, 14, 0.55); opacity: 0; transition: opacity 200ms ease; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 560px; max-height: 92%;
  overflow-y: auto; overscroll-behavior: contain;
  background: #0E1B20; color: #E6F0EE; border-radius: 24px 24px 0 0;
  padding: 12px 24px calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translateY(100%); transition: transform 200ms var(--ease-out);
  display: grid; gap: 18px; justify-items: center; text-align: center;
}
.sheet-wrap[data-open] .sheet-backdrop { opacity: 1; }
.sheet-wrap[data-open] .sheet { transform: translateY(0); transition: transform 420ms var(--ease-drawer); }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: rgba(230,240,238,0.2); }
.sheet h2 { font-family: var(--f-display); font-weight: 500; font-size: 24px; }
.breath { width: 200px; height: 200px; display: grid; place-items: center; }
.breath .orb {
  width: 200px; height: 200px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #B5EDE2, #4BA196 55%, #1F535A 100%);
  box-shadow: 0 0 60px rgba(95,182,169,0.35);
  transform: scale(0.6); will-change: transform;
}
.phase { font-size: 20px; font-weight: 600; min-height: 1.6em; }
.cycles { font-size: 14px; color: rgba(230,240,238,0.6); font-variant-numeric: tabular-nums; }
.sheet ol { text-align: left; margin: 0; padding-left: 1.3em; display: grid; gap: 8px; color: rgba(230,240,238,0.85); max-width: 46ch; }
.sheet .help { font-size: 14px; color: rgba(230,240,238,0.65); user-select: text; }
.sheet .close { border: 0; border-radius: 999px; padding: 10px 26px; background: rgba(230,240,238,0.1); color: #E6F0EE; font-weight: 600; }

/* ---------- toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 2147482000;
  transform: translate(-50%, 140%); opacity: 0;
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 15px;
  transition: transform 260ms var(--ease-out), opacity 200ms ease;
  pointer-events: none; max-width: calc(100% - 32px); text-align: center;
}
body[data-variant="guided"] .toast { bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
body[data-variant="night"] .toast { background: #E7EEF5; color: #0B1220; }
.toast[data-show] { transform: translate(-50%, 0); opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  [data-enter] .enter { animation: fade 200ms ease both; }
  @keyframes fade { from { opacity: 0; } }
  .n-orb { animation: none; }
  .sheet, .sheet-wrap[data-open] .sheet { transition: opacity 200ms ease; transform: none; }

      <h1>${c[0]}</h1>
      <p>${c[1]}</p>
      <div class="j-ticks" aria-hidden="true">${MODULES.map((_, i) => `<i class="${i < CURRENT ? 'on' : i === CURRENT ? 'now' : ''}"></i>`).join('')}</div>
    </section>
    <div class="j-grid enter">
      <section class="j-toc">
        <h2>${t().contents}</h2>
        <ol>${MODULES.map((_, i) => {
          const x = m(i), st = stateOf(i), open = S.open === i;
          const lab = st === 'done' ? t().done : st === 'current' ? t().current : `${MODULES[i].min} ${t().min}`;
          return `<li class="j-row" ${st === 'current' ? 'data-current' : ''}>
            <button data-action="mod" data-v="${i}" aria-expanded="${open}">
              <span class="n">${i === 0 ? '·' : String(i).padStart(2, '0')}</span>
              <span class="ti">${x[0]}</span>
              <span class="st ${st === 'done' ? 'done' : st === 'current' ? 'cur' : ''}">${lab}</span>
            </button>
            ${open ? `<div class="j-detail"><p>${x[1]}</p><p><b>${t().practice}:</b> ${x[2]} · ${MODULES[i].min} ${t().min}</p></div>` : ''}
          </li>`; }).join('')}
        </ol>
      </section>
      <aside class="j-side">
        <div class="j-card">
          <span class="tag">${t().today}</span>
          <p class="pr">${c[2]}</p>
          <div class="row"><span class="meta">${MODULES[CURRENT].min} ${t().min} · ${t().week(CURRENT)}</span>
            <button class="btn press" data-action="continue">${t().cont} →</button></div>
        </div>
        <div class="j-card">
          <span class="tag">${t().log}</span>
          <p class="j-sub">${t().how}</p>
          ${meter()}
          <p class="j-sub">${t().what}</p>
          ${chips()}
          ${note()}
          <button class="btn press" data-action="save">${t().save}</button>
        </div>
        <div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><span class="tag">${t().recent}</span>${S.logs.some(l => l.ex) ? `<span class="example">${t().example}</span>` : ''}</div>
          ${logs()}
        </div>
      </aside>
    </div>
    ${foot()}
  </div>`;
}

/* ---------------- variant 2 · Guided ---------------- */
const ICON = {
  today: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></svg>',
  log: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>',
  wind: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8h11a3 3 0 1 0-3-3M3 16h15a3 3 0 1 1-3 3M3 12h17"/></svg>'
};
function guided() {
  const c = m(CURRENT);
  const tabBtn = (k, label, icon) => `<button class="press" data-action="tab" data-v="${k}" ${S.tab === k ? 'aria-current="page"' : ''}>${icon}<span>${label}</span></button>`;
  let body = '';
  if (S.tab === 'today') {
    body = `
      <section class="g-track enter">
        <div class="bars" aria-hidden="true">${MODULES.map((_, i) => `<i class="${i < CURRENT ? 'on' : i === CURRENT ? 'now' : ''}"></i>`).join('')}</div>
        <div class="lbl"><span>${t().week(CURRENT)}</span><span>${t().thisweek(S.logs.length)}</span></div>
      </section>
      <section class="g-step enter">
        <span class="tag">${t().today} · ${MODULES[CURRENT].min} ${t().min}</span>
        <h2>${c[2]}</h2>
        <p>${c[0]}</p>
        <button class="btn press" data-action="continue">${t().cont} →</button>
      </section>
      <section class="g-card enter">
        <h3>${t().how}</h3>
        ${meter()}
        ${S.level ? `<h3>${t().what}</h3>${chips()}<button class="btn press" data-action="save">${t().save}</button>` : ''}
      </section>
      ${foot()}`;
  } else if (S.tab === 'book') {
    body = `<section class="g-mods enter">${MODULES.map((_, i) => {
      const x = m(i), st = stateOf(i), open = S.open === i;
      const pill = st === 'done' ? t().done : st === 'current' ? t().current : st === 'next' ? t().next : `${MODULES[i].min} ${t().min}`;
      return `<div class="g-mod" data-state="${st}">
        <button data-action="mod" data-v="${i}" aria-expanded="${open}">
          <span class="num">${i === 0 ? '✦' : st === 'done' ? '✓' : i}</span>
          <span><span class="ti">${x[0]}</span><br><span class="sub">${i === 0 ? t().start : `${t().wk} ${i}`}</span></span>
          <span class="pill">${pill}</span>
        </button>
        ${open ? `<div class="more"><p>${x[1]}</p><p><b>${t().practice}:</b> ${x[2]}</p></div>` : ''}
      </div>`; }).join('')}</section>`;
  } else {
    body = `
      <section class="g-card enter">
        <h3>${t().how}</h3>${meter()}
        <h3>${t().what}</h3>${chips()}
        ${note()}
        <button class="btn press" data-action="save">${t().save}</button>
      </section>
      <section class="g-card enter">
        <div style="display:flex;justify-content:space-between;align-items:center"><h3>${t().recent}</h3>${S.logs.some(l => l.ex) ? `<span class="example">${t().example}</span>` : ''}</div>
        ${logs(8)}
      </section>`;
  }
  return `<div class="g">
    <header class="g-head enter"><b>${t().name}</b>${langToggle()}${quickExit()}</header>
    ${body}
    <nav class="g-tabs" aria-label="Sections"><div class="in">
      ${tabBtn('today', t().tabToday, ICON.today)}
      ${tabBtn('book', t().tabBook, ICON.book)}
      <button class="coolbtn" data-action="cool" aria-label="${esc(t().cool)}">${ICON.wind}</button>
      ${tabBtn('log', t().tabLog, ICON.log)}
    </div></nav>
  </div>`;
}

/* ---------------- variant 3 · Night ---------------- */
function night() {
  const L = S.level;
  const sel = S.open == null ? CURRENT : S.open;
  const x = m(sel);
  let reply = '';
  if (L && L >= 7) reply = `<p>${t().high}</p><button class="btn hotbtn press" data-action="cool">${t().cool}</button>`;
  else if (L && L >= 4) reply = `<p>${t().mid}</p>${chips()}<button class="btn press" data-action="save">${t().save}</button>`;
  else if (L) reply = `<p>${t().low}</p><button class="btn press" data-action="continue">${t().cont}: ${m(CURRENT)[0]}</button>`;
  return `<div class="n">
    <header class="n-head enter"><b>${t().name}</b>${langToggle()}${quickExit()}</header>
    <section class="n-hero enter">
      <div class="n-orb" aria-hidden="true"></div>
      <h1>${t().hot}</h1>
      <div class="n-therm" role="group" aria-label="${esc(t().how)}">
        ${Array.from({ length: 10 }, (_, k) => k + 1).map(n =>
          `<button class="${L && n <= L ? 'fill' : ''}" style="--h:${heat(n)};height:${32 + n * 5}px" data-action="level" data-v="${n}" aria-pressed="${L === n}">${n}</button>`).join('')}
      </div>
      <div class="n-scale"><span>${t().calm}</span><span>${L ? `${L} · ${levelName(L)}` : ''}</span><span>${t().boiling}</span></div>
      ${reply ? `<div class="n-reply">${reply}</div>` : ''}
    </section>
    <section class="n-path enter">
      <h2>${t().path}</h2>
      <div class="n-weeks">${MODULES.map((_, i) =>
        `<button class="press" data-action="mod" data-v="${i}" data-state="${stateOf(i)}" aria-pressed="${sel === i}">
          <span class="k">${i === 0 ? '' : t().wk}</span><span class="v">${wkLabel(i)}</span></button>`).join('')}</div>
      <div class="n-mod">
        <span class="tag">${sel === 0 ? t().start : `${t().wk} ${sel}`} · ${MODULES[sel].min} ${t().min}</span>
        <h3>${x[0]}</h3><p>${x[1]}</p><p><b>${t().practice}:</b> ${x[2]}</p>
      </div>
    </section>
    ${foot()}
  </div>`;
}

const variants = [journal, guided, night];
const NAMES = ['journal', 'guided', 'night'];

/* ---------------- rendering ---------------- */
const stage = document.getElementById('stage');
function applyLang() {
  document.documentElement.lang = S.lang;
}
function rerender() {
  const y = window.scrollY;
  stage.removeAttribute('data-enter');
  stage.innerHTML = variants[current]();
  document.body.dataset.variant = NAMES[current];
  window.scrollTo(0, y);
}

/* ---------------- cool-down sheet ---------------- */
const sheet = document.getElementById('sheet');
const sheetBody = document.getElementById('sheet-body');
let hideTimer = null, breathTimer = null, breaths = 0, lastFocus = null;
function renderSheet() {
  sheetBody.innerHTML = `
    <span class="grab" aria-hidden="true"></span>
    <h2 id="sheet-title">${t().cool}</h2>
    <div class="breath" aria-hidden="true"><div class="orb" id="orb"></div></div>
    <p class="phase" id="phase" aria-live="polite"></p>
    <p class="cycles" id="cycles">${t().cycles(breaths)}</p>
    <ol>${t().steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>
    <p class="help"><strong>${t().safety}</strong><br>${t().lines}</p>
    <button class="close press" data-action="close-cool">${t().close}</button>`;
}
function breathe(phaseIn) {
  const orb = document.getElementById('orb'), phase = document.getElementById('phase');
  if (!orb) return;
  const dur = phaseIn ? 4000 : 6000;
  orb.style.transition = `transform ${dur}ms var(--ease-io)`;
  orb.style.transform = phaseIn ? 'scale(1)' : 'scale(0.6)';
  phase.textContent = phaseIn ? t().breatheIn : t().breatheOut;
  if (!phaseIn) { breaths++; }
  breathTimer = setTimeout(() => {
    if (!phaseIn) document.getElementById('cycles').textContent = t().cycles(breaths);
    breathe(!phaseIn);
  }, dur);
}
function openCool() {
  clearTimeout(hideTimer); clearTimeout(breathTimer);
  breaths = 0; lastFocus = document.activeElement;
  renderSheet();
  sheet.hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    sheet.setAttribute('data-open', '');
    sheetBody.querySelector('.close').focus({ preventScroll: true });
    breathe(true);
  }));
}
function closeCool() {
  clearTimeout(breathTimer);
  sheet.removeAttribute('data-open');
  hideTimer = setTimeout(() => { sheet.hidden = true; }, 220);
  if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
}

/* ---------------- toast ---------------- */
const toastEl = document.getElementById('toast');
let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.setAttribute('data-show', '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.removeAttribute('data-show'), 2200);
}

/* ---------------- actions ---------------- */
document.addEventListener('input', e => { if (e.target.id === 'note') S.note = e.target.value; });
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action, v = el.dataset.v;
  if (a === 'lang') {
    S.lang = v; try { localStorage.setItem('amaidhi-lang', v); } catch (err) {}
    applyLang(); rerender(); if (!sheet.hidden) { clearTimeout(breathTimer); renderSheet(); breathe(true); }
  } else if (a === 'cool') openCool();
  else if (a === 'close-cool') closeCool();
  else if (a === 'level') { const n = +v; S.level = S.level === n ? null : n; rerender(); }
  else if (a === 'trig') { S.trig = S.trig === v ? null : v; rerender(); }
  else if (a === 'mod') { const i = +v; S.open = (S.open === i && current !== 2) ? null : i; rerender(); }
  else if (a === 'tab') { S.tab = v; S.open = null; window.scrollTo(0, 0); rerender(); }
  else if (a === 'continue') {
    S.open = CURRENT;
    if (current === 1) { S.tab = 'book'; window.scrollTo(0, 0); }
    rerender();
    if (current === 0) document.querySelector('.j-row[data-current]')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    if (current === 2) document.querySelector('.n-mod')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  } else if (a === 'save') {
    if (!S.level) { toast(t().pick); return; }
    S.logs.unshift({ d: 'today', lvl: S.level, trig: S.trig, did: S.note ? { [S.lang]: S.note } : null });
    S.level = null; S.trig = null; S.note = '';
    rerender(); toast(t().saved);
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !sheet.hidden) closeCool(); }, true);

/* ---------------- picker wiring (verbatim reference) ---------------- */
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}
function mount(i) {
  stage.innerHTML = '';
  document.body.dataset.variant = NAMES[i];
  requestAnimationFrame(() => { stage.setAttribute('data-enter', ''); stage.innerHTML = variants[i](); });
}
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  S.open = null; S.level = null; S.trig = null; S.tab = 'today';
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  try { history.replaceState(null, '', url); } catch (e) {}
  mount(i);
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (!sheet.hidden) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

applyLang();
setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
document.fonts?.ready.then(moveHighlight);
</script>
