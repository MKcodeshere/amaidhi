<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Amaidhi · அமைதி</title>
<meta name="description" content="A free, private anger workbook in English and Tamil. SOS mode walks you from boiling to calm in about twenty minutes.">
<meta name="theme-color" content="#060809">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="Amaidhi · அமைதி">
<meta property="og:description" content="Anger is fire. Calm is water. A free, private anger workbook in English and Tamil.">
<meta property="og:image" content="assets/img/hero.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Catamaran:wght@400;500;600;700&family=Noto+Serif+Tamil:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/app.css">
<script>document.documentElement.classList.add('js');</script>
</head>
<body>
<div class="wash" aria-hidden="true"></div>
<canvas id="embers" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>

<header class="top" id="top"></header>
<main id="home"></main>
<footer class="foot" id="foot"></footer>

<div class="sos" id="sos" role="dialog" aria-modal="true" aria-labelledby="sos-title" hidden>
  <div class="sos-bg" aria-hidden="true">
    <div class="layer hot" data-on></div>
    <div class="layer cool"></div>
    <div class="layer photo" data-photo="stop"></div>
    <div class="layer photo" data-photo="away"></div>
    <div class="layer photo" data-photo="body"></div>
    <div class="layer photo" data-photo="breathe"></div>
    <video class="layer photo" data-photo="breathe-video" muted loop playsinline preload="none"></video>
    <div class="layer photo" data-photo="after"></div>
  </div>
  <div class="sos-top" id="sos-top"></div>
  <div class="sos-stage" id="sos-stage"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="assets/app.js"></script>
</body>
</html>
